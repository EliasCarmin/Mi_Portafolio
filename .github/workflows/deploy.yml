name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Vite sustituye esta variable durante el build. Se admite tanto
      # Repository Variable como Repository Secret con el mismo nombre.
      VITE_CHAT_API_URL: ${{ vars.VITE_CHAT_API_URL || secrets.VITE_CHAT_API_URL }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Validate chat API configuration
      run: |
        if [ -z "$VITE_CHAT_API_URL" ]; then
          echo "::error::VITE_CHAT_API_URL is not configured as a GitHub Actions variable or secret."
          exit 1
        fi
        case "$VITE_CHAT_API_URL" in
          https://*) ;;
          *)
            echo "::error::VITE_CHAT_API_URL must use HTTPS for GitHub Pages."
            exit 1
            ;;
        esac

    - name: Build
      run: npm run build

    - name: Verify production bundle
      run: |
        if grep -R "localhost:50505" dist/assets/*.js; then
          echo "::error::The production bundle still contains the localhost chat API fallback."
          exit 1
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false